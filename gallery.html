<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panji Portfolio | Gallery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/custom.css" />
</head>
<body>
<nav class="relative z-30 px-6 md:px-12 lg:px-20 py-7 flex items-center justify-between">
  <a href="index.html" class="flex items-center gap-3">
    <img src="assets/logo.png" alt="Panji logo" class="w-12 h-auto object-contain" />
  </a>
  <div class="hidden md:flex gap-5 text-2xl">
    <a href="index.html" class="nav-link ">Home</a>
    <a href="hobby.html" class="nav-link ">Hobby</a>
    <a href="gallery.html" class="nav-link active">Gallery</a>
  </div>
  <button id="menuToggle" class="md:hidden text-4xl leading-none" aria-label="Open menu">☰</button>
  <div id="mobileMenu" class="mobile-menu absolute top-20 left-6 right-6 bg-[#e7ebf3]/95 backdrop-blur rounded-2xl shadow-lg md:hidden">
    <div class="flex flex-col p-5 gap-3 text-2xl text-center">
      <a href="index.html" class="nav-link ">Home</a>
      <a href="hobby.html" class="nav-link ">Hobby</a>
      <a href="gallery.html" class="nav-link active">Gallery</a>
    </div>
  </div>
</nav>
<main class="relative min-h-screen overflow-hidden px-6 md:px-12 lg:px-20 pb-24">
  <span class="blob blob-one left-[-120px] top-[190px]"></span>
  <span class="blob blob-two right-[-60px] top-[460px]"></span>
  <span class="blob blob-two left-[-90px] bottom-[40px]"></span>

  <section class="relative z-10 pt-14 md:pt-24">
    <h1 class="section-title text-center font-bold mb-12 reveal opacity-0 translate-y-8 transition-all duration-700">My Gallery</h1>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-7 md:gap-10 max-w-5xl mx-auto reveal opacity-0 translate-y-8 transition-all duration-700">
      <img data-gallery src="assets/sport.png" alt="Gallery olahraga" class="gallery-card photo-card w-full h-[340px] md:h-[460px]" />
      <img data-gallery src="assets/game.png" alt="Gallery game" class="gallery-card photo-card w-full h-[340px] md:h-[360px]" />
      <img data-gallery src="assets/music-book.png" alt="Gallery musik" class="gallery-card photo-card w-full h-[340px] md:h-[460px] lg:mt-24" />
      <img data-gallery src="assets/music-quote.png" alt="Quote tentang musik" class="gallery-card photo-card w-full h-[220px] md:h-[260px] sm:col-span-1 lg:col-start-1 lg:ml-auto lg:w-[70%]" />
    </div>
  </section>
</main>

<div id="imageModal" class="hidden fixed inset-0 z-50 bg-black/80 items-center justify-center p-5">
  <button id="closeModal" class="absolute top-5 right-7 text-white text-5xl" aria-label="Close image">×</button>
  <img id="modalImg" src="" alt="Preview gallery" class="max-w-[92vw] max-h-[84vh] rounded-xl shadow-2xl object-contain" />
</div>
<script src="js/script.js"></script>
</body>
</html>
